    aggregation:
      plugin_name: Combine Timelines
      plugin_description: !md |
        This plugin combines several timelines into one, which can reveal more complex patterns. For example, _Logical And_ shows when two concepts or persons are visible at the same time.

        You can run the plugin several times to build more complex patterns. For example, to find when _Concept A_ is visible together with _Concept B_ or _Concept C_:

        AGG1 = (Concept B) Logical Or (Concept C)\
        AGG2 = (Concept A) Logical And (AGG1)

        **Tip:** To find when something is _not_ visible, first invert its timeline with the "Invert Timeline" plugin.

        #### Parameters

        - **Select Timeline:** two or more timelines with values between 0 and 1, e.g., probabilities. Timelines with annotations, such as shots or transcripts, cannot be combined.
        - **Aggregation Method:** how the values are combined:
          - **Logical Or:** high where at least one timeline is high.
          - **Logical And:** high only where all timelines are high.
          - **Mean:** the average of all timelines.
          - **Product:** the values of all timelines multiplied.
      timeline_name: Aggregated Timeline
      method: Aggregation Method
      logical_or: Logical Or
      logical_and: Logical And
      mean: Mean
      max: Maximum
      min: Minimum
      prod: Product
    audio_classification:
      plugin_name: Sound Classification (EAT)
      plugin_description: !md |
        This plugin recognizes which kinds of sounds occur in each shot of the video, for example speech, laughter, music genres, musical instruments, animals, vehicles, or explosions. It uses the [EAT (Efficient Audio Transformer)](https://arxiv.org/abs/2401.03497) model, trained on Google's [AudioSet](https://research.google.com/audioset/) dataset, which distinguishes [527 sound classes](http://storage.googleapis.com/us_audioset/youtube_corpus/v1/csv/class_labels_indices.csv) (list as CSV file).

        The result is a timeline with one segment per shot, labeled with the recognized sound classes (English AudioSet names). Several classes can be recognized at the same time, for example speech and background music. Shots in which no class reaches the confidence threshold remain without a label. 
        
        **Note: Currently, only the first 10 seconds of each shot are analyzed. We are working on a solution.**

        #### Parameters

        - **Shot Boundaries from Timeline:** the timeline whose shots are analyzed, e.g., the result of the "Shot Boundary Detection" plugin.
        - **Number of predicted classes (top-k):** the maximum number of sound classes per shot. Higher values allow more labels per shot. 
        - **Confidence threshold:** the minimum probability a sound class needs to be shown. Higher values show fewer but more reliable labels; lower values also show uncertain ones.
      timeline_name: Audio Classification
      top_k: Number of predicted classes (top-k)
      threshold: Confidence threshold
    audio_emotion:
      plugin_name: Audio Emotion Classification
      timeline_name: Audio Emotion Classification
      plugin_description: This plugin detects emotions from audio segments (retrieved with WhisperX).
    audio_frequency:
      plugin_name: Audio Spectrogram (STFT)
      plugin_description: !md |
        This plugin shows which frequencies are present in the audio track over time. The [librosa](https://librosa.org/) library computes a [short-time Fourier transform (STFT)](https://librosa.org/doc/latest/api/generated/librosa.stft.html): the audio is split into short, overlapping windows, and the strength of each frequency is measured within each window. The result is displayed as a heatmap, with time on the horizontal axis and frequency on the vertical axis.

        The spectrogram can reveal voices, music, rhythmic patterns, and other recurring sounds. Intensities are scaled from 0 (weakest) to 1 (strongest in the video), so they are best compared within one video rather than between videos.

        #### Parameters

        - **Sampling rate**: the highest frequency shown is half the sampling rate. Higher values show more detail in music and noises but take longer to compute.
        - **FFT window length (samples)**: longer windows separate neighboring frequencies more finely but blur short sounds in time; shorter windows show short sounds more precisely but with coarser frequencies.
      timeline_name: Audio Spectrogram
      sr: Sampling Rate
      n_fft: FFT window length (samples)
    audio_gender:
      plugin_name: Audio Gender Classification
      timeline_name: Audio Gender Classification
      plugin_description: This plugin detects the gender from audio/speech segments (retrieved with WhisperX).
    audio_rms:
      plugin_name: Audio Volume (RMS)
      plugin_description: !md |
        This plugin measures how loud the audio track is over time. The [librosa](https://librosa.org/) library computes the [root mean square (RMS) energy](https://librosa.org/doc/latest/api/generated/librosa.feature.rms.html) of the audio in short, overlapping windows.

        The timeline reveals silent passages, loud scenes such as music or action sequences, and sudden changes in volume. The curve is scaled from 0 (the quietest moment of the video) to 1 (the loudest), so it is best used to compare passages within one video rather than between videos.

        #### Parameters
        - **Sampling rate**: higher values give a finer time resolution but take longer to compute.
      timeline_name: RMS Volume
      sr: Sampling Rate
    audio_waveform:
      plugin_name: Audio Waveform
      plugin_description: !md |
        This plugin draws the waveform of the audio track, similar to the view in an audio editor. The [librosa](https://librosa.org/) library [resamples](https://librosa.org/doc/latest/api/generated/librosa.resample.html) the audio to a fixed number of points so that it can be displayed as a timeline.

        Silence lies around the middle of the timeline; the further the curve swings up and down, the louder the sound. The scale is relative to the quietest and loudest values of the video, so the waveform is best compared within one video. To follow the volume over time, the "Audio Volume (RMS)" plugin is easier to read.

        #### Parameters
        - **Sampling rate**: the rate at which the audio is loaded. Higher values keep more detail but take longer to compute.
      timeline_name: Audio Waveform
      sr: Sampling Rate
    blip:
      plugin_name: Visual Question Answering (InstructBLIP)
      plugin_description: !md |
        This plugin uses the large vision language model [InstructBLIP](https://arxiv.org/abs/2305.06500) that is similar to GPT-4 to perform question answering over the video. It can be used for various purposes, for example, to automatically find concepts within the video. Here are some examples:

        _Does this image show a car? Please answer with yes or no!\
        Does this image show at least three persons? Please answer with yes or no!\
        Is this photo taken in a restaurant? Please answer with yes or no!_
      timeline_name: InstructBLIP Visual QA
      search_term: Question
    clip:
      plugin_name: Visual Concept Search (CLIP)
      plugin_description: !md |
        This plugin searches the video for any visual concept you describe in words, e.g., objects, places, situations, times of day, or weather conditions. It uses a multilingual [OpenCLIP](https://github.com/mlfoundations/open_clip) model ([model details](https://huggingface.co/laion/CLIP-ViT-B-32-xlm-roberta-base-laion5B-s13B-b90k)) trained by [LAION](https://laion.ai/) on billions of image–text pairs, based on the CLIP architecture by [Radford et al. (2021)](https://arxiv.org/abs/2103.00020).

        Frames are taken from the video at the selected rate, and CLIP compares each frame with your description. To make the comparison more robust, the description is automatically inserted into 80 standard phrasings such as "a photo of a …" or "a drawing of a …", and the results are averaged. The timeline shows for each moment how well the frame matches the description.

        The values are scaled per timeline, so the best-matching moment is always 1, even if the concept does not appear in the video at all. Read the timeline as "where the concept most likely appears", not as a yes/no answer.

        CLIP works well for concepts that can be recognized in a single frame. For concepts that require movement over time, such as human actions, use the "Action Classification (X-CLIP)" plugin.

        #### Parameters

        - **Concept Description:** the concept you are looking for, in simple, unambiguous terms, e.g., _car_, _a red car_, or _people dancing in the rain_. Do not add phrases like "a photo of", because they are added automatically. Descriptions in other languages work as well, but English usually gives the best results.
        - **Frames per Second (FPS)** (advanced option): how many frames per second are analyzed. Higher values also find concepts that are only visible briefly, but take longer to compute.
      timeline_name: Concept Search
      search_term: Concept Description
    clip_ontology:
      plugin_name: Visual Concept Classification with a Concept List (CLIP)
      plugin_description: !md |
        This plugin assigns the frames of the video to a list of visual concepts that you define, e.g., times of day, places, or types of scenes. It uses the same multilingual [OpenCLIP](https://github.com/mlfoundations/open_clip) model ([model details](https://huggingface.co/laion/CLIP-ViT-B-32-xlm-roberta-base-laion5B-s13B-b90k)) trained by [LAION](https://laion.ai/) as the "Visual Concept Search (CLIP)" plugin.

        Frames are taken from the video at the selected rate, and CLIP compares each frame with the descriptions of all concepts in your list. The similarities are converted into probabilities that add up to 1 for each frame. Each frame is therefore always assigned to the concepts in your list, even if none of them fits. Your list should therefore cover all alternatives that can occur, e.g., _day_ and _night_, or _indoor_ and _outdoor_. To search for a single concept on its own, use the "Visual Concept Search (CLIP)" plugin instead.

        The result consists of one timeline per concept, showing its probability over time. If a shot timeline is selected, an additional timeline labels each shot with the concept that has the highest average probability within the shot.

        CLIP works well for concepts that can be recognized in a single frame. For concepts that require movement over time, such as human actions, use the "Action Classification (X-CLIP)" plugin.

        #### Parameters

        - **Shot Boundaries from Timeline:** optional. If a shot timeline is selected, each shot is labeled with its most likely concept.
        - **Concept Lexicon:** a CSV file with one concept per row and two columns separated by commas: the name of the concept, which is used as the name of its timeline, and a description in simple, unambiguous terms. Unlike in "Visual Concept Search (CLIP)", the descriptions are used exactly as written, so full phrases work best. Do not include a header row. Example:

          "day","a photo taken at daylight"\
          "night","a photo taken during the night"

          If you create the file with a spreadsheet program, make sure it is saved with commas, not semicolons.
        - **Frames per Second (FPS)** (advanced option): how many frames per second are analyzed. Higher values also find concepts that are only visible briefly, but take longer to compute.
      timeline_name: Concepts
      concepts: Concept Lexicon
      concepts_hint: CSV file with one concept per row; first column the name, second column a description
    color_analysis:
      plugin_name: Dominant Colors
      plugin_description: !md |
        This plugin determines the dominant colors of the video over time. For each analyzed frame, the colors of all pixels are grouped with the [k-means clustering algorithm](https://scikit-learn.org/stable/modules/clustering.html#k-means) of the [scikit-learn](https://scikit-learn.org/) library; the average color of each group is one dominant color.

        The result is shown as color timelines. With one color, a single timeline shows the dominant color over time. With several colors, one timeline is created for each of the most dominant colors, numbered "#0", "#1", and so on.

        #### Parameters

        - **Number of dominant color(s):** how many dominant colors are determined per frame.
        - **Frames per Second (FPS):** how many frames per second are analyzed. Higher values show color changes more precisely in time but take longer to compute.
        - **Maximum image resolution used for the analysis:** frames are scaled down to this size before the analysis. Low values are usually sufficient, since dominant colors cover large areas.
        - **Maximum number of iterations for k-Means clustering:** how many refinement steps the clustering may take per frame. 
      timeline_name: Dominant Colors
      slider: Number of dominant color(s)
      max_resolution: Maximum image resolution used for the analysis
      max_iter: Maximum number of iterations for k-Means clustering
    color_brightness_analysis:
      plugin_name: Brightness
      plugin_description: !md |
        This plugin measures how bright the video is over time. For each analyzed frame, the [OpenCV](https://opencv.org/) library converts the image to the HSV color model, and the brightness is the average "value" (V) of all pixels, from 0 (black) to 1 (maximum brightness).

        The timeline can reveal dark and bright scenes, for example night and day scenes, as well as fades and lighting changes.

        #### Parameters

        - **Frames per Second (FPS):** how many frames per second are analyzed. Higher values show brightness changes more precisely in time but take longer to compute.
        - **Normalize Results?:** if enabled, the curve is scaled so that the darkest frame of the video is 0 and the brightest is 1. This makes differences within a video easier to see. If disabled, the absolute values are shown, which can be compared between videos.
      timeline_name: Brightness
    face_clustering:
      plugin_name: Face Clustering (InsightFace)
      plugin_description: !md |
        This plugin gives you an overview of the main characters by grouping their faces into clusters, ideally one per person. It does not find every appearance of a person; that is done in step 2 of the workflow below. Faces are detected and facial features are extracted with [InsightFace](https://github.com/deepinsight/insightface) ([SCRFD](https://arxiv.org/abs/2105.04714) and [ArcFace](https://arxiv.org/abs/1801.07698)). Similar faces are then grouped together.

        #### Typical workflow

        1. **Find the main persons:** check the clusters in the tab "Faces"; remove wrong faces, merge clusters, or run the plugin again with a different threshold.
        2. **Find all appearances:** convert relevant clusters to timelines in the tab "Faces". Now _all faces_ in the video are compared with the cluster, and the timeline shows where the person most likely appears.
        3. **Visualize relations:** use the visualization options to create a constellation graph of which persons appear together.

        #### Parameters

        - **Clustering threshold:** lower values split people into more, purer clusters; higher values merge more faces, possibly of different people.
        - **Maximum number of clusters:** how many of the largest clusters are kept.
        - **Sample faces per cluster:** how many faces per cluster are shown and used as the reference in step 2.
        - **Minimum face height:** smaller faces are ignored for clustering, which makes the clusters more reliable. They are still found in step 2 of the workflow.
        - **Clustering method:** the algorithm used to group similar faces.
        - **Frames per Second (FPS):** higher values also find briefly visible people but take longer.
      threshold:
        name: Clustering threshold
        hint_left: More clusters, higher cluster purity
        hint_right: Fewer clusters, lower cluster purity
      max_cluster:
        name: Maximum number of clusters
        hint_left: Fewer clusters to display
        hint_right: More clusters to display
      max_faces:
        name: Sample faces per cluster
        hint_left: Fewer faces per cluster
        hint_right: More faces per cluster
      min_face_height:
        name: Minimum face height
        hint_left: Smaller faces included
        hint_right: Only larger faces
      clustering_method_name: Select a clustering method
      clustering_method_hint: Algorithm used to group similar faces
    face_identification:
      plugin_name: Face Search by Image (InsightFace)
      plugin_description: !md |
        This plugin searches the video for a person shown in an example image you upload. To get an overview of the main characters without a photo, use "Face Clustering (InsightFace)" instead. Faces are detected and facial features are extracted with [InsightFace](https://github.com/deepinsight/insightface) ([SCRFD](https://arxiv.org/abs/2105.04714) and [ArcFace](https://arxiv.org/abs/1801.07698)). Every face in the video is then compared with the example face.

        The highest value of the timeline is always 1, even if the person does not appear in the video at all. Thus, read the timeline as "where the person most likely appears", not as a yes/no answer.

        #### Parameters

        - **Example image:** a photo of the person, ideally showing only this face, clearly visible. If it contains several faces, all of them are searched for; if it contains none, the plugin fails.
        - **Frames per Second (FPS):** higher values also find briefly visible people but take longer.
      timeline_name: Face Search
      query_images: Example image (JPG, PNG, or WebP)
      query_images_hint: The image should show only the person you are looking for, with the face clearly visible and in good quality.
    facedetection:
      plugin_name: Face Detection
    faceemotion:
      plugin_name: Facial Expression Recognition (DeepFace)
      plugin_description: !md |
        This plugin recognizes the facial expressions of the people in the video. Faces are detected with [InsightFace](https://github.com/deepinsight/insightface) and classified with the facial expression model of [DeepFace](https://github.com/serengil/deepface) into seven classes based on Ekman's basic emotions: angry, disgust, fear, happy, sad, surprise, and neutral.

        The result consists of one timeline per expression, showing its probability over time. If several faces are visible at the same time, their probabilities are combined. If a shot timeline is selected, an additional timeline labels each shot with its most likely expression. Results are most reliable for large, frontal, well-lit faces; subtle expressions are often classified as neutral.

        #### Parameters

        - **Shot Boundaries from Timeline:** optional; if selected, each shot is labeled with its most likely expression.
        - **Minimum face height:** smaller faces are ignored. Higher values give more reliable results and combine fewer faces, but people in the background are not analyzed. Lower values include them, but mix more and less reliable faces into the result.
        - **Frames per Second (FPS):** higher values also capture short expressions but take longer.
      timeline_name: Facial Expressions
    facesize:
      plugin_name: Face Size Analysis
      timeline_name: Face Size
    invert:
      plugin_name: Invert Timeline
      plugin_description: !md |
        This plugin inverts a timeline with values: high values become low and low values become high. Each value is replaced by 1 minus the value; values outside the range from 0 to 1 are first scaled to this range.

        Together with the "Combine Timelines" plugin, it can be used to find moments when something is _not_ the case. For example, to find when _Concept A_ is visible without _Concept B_:

        INV1 = Invert Timeline (Concept B)\
        AGG1 = (Concept A) Logical And (INV1)

        #### Parameters

        - **Select Timeline:** the timeline with values to be inverted, e.g., a person timeline or the result of "Visual Concept Search".
      timeline_name: Inverted Timeline
    movie_pattern_frameshare:
      plugin_name: Movie Pattern Frameshare
      plugin_description: This plugin detects the movie pattern frameshare based on the shot boundaries of a selected timeline.
