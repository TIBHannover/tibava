    place_clustering:
      plugin_name: Place Clustering (CLIP)
      plugin_description: !md |
        This plugin gives you an overview of the recurring settings in the video by grouping shots that show the same or a very similar place, e.g., the same apartment, office, or street. Unlike "Place Recognition (Places365)", which assigns general categories such as "kitchen", it finds places that occur several times in this particular video.

        For each shot of the selected shot timeline, the middle frame is used. A multilingual [OpenCLIP](https://github.com/mlfoundations/open_clip) model computes a numerical description of each image, and images with similar descriptions are grouped into clusters, ideally one cluster per place. Two shots end up in the same cluster if they are similar enough, either directly or through a chain of similar shots. Because of this chaining, a threshold that is only slightly too high can merge different places into one cluster.

        Please note that the comparison is based on how similar the images look. Two different places that look alike, e.g., two kitchens, can end up in the same cluster, and the same place shown from very different angles can be split into several clusters.

        #### Typical workflow

        1. **Create clusters:** run this plugin and check the clusters in the tab "Places". Remove wrong images or merge clusters where needed, or run the plugin again with a different threshold.
        2. **Convert clusters to timelines:** for each relevant cluster, create a timeline in the tab "Places" to see when the place appears in the video.

        #### Parameters

        - **Shot Boundaries from Timeline:** the shots to be grouped, e.g., the timeline created by the "Shot Boundary Detection" plugin. One image per shot is used, so the quality of the shot timeline directly determines the result.
        - **Clustering threshold:** how different two images may be and still belong to the same cluster. Lower values create more and purer clusters, but one place may be split into several clusters. Higher values create fewer clusters, but different places may be merged.
        - **Maximum number of clusters:** how many of the largest clusters are kept. Smaller clusters, often places that appear only once, are discarded.

        **Tip:** if a cluster contains different places, lower the clustering threshold. If one place is spread over several clusters, raise it slightly or merge the clusters in the tab "Places".
      encoder_name: Select an image encoder
      threshold:
        name: Clustering threshold
        hint_left: More clusters, higher cluster purity
        hint_right: Fewer clusters, lower cluster purity
      max_cluster:
        name: Maximum number of clusters
        hint_left: Fewer clusters to display
        hint_right: More clusters to display
      clustering_method_name: Select a clustering method
      clustering_method_hint: Both methods currently produce the same result.
    place_identification:
      plugin_name: Place Identification
    places_classification:
      plugin_name: Place Recognition
      plugin_description: !md |
        This plugin recognizes the type of place shown in each shot, e.g., a kitchen, a street, a forest, or a church. It uses a ResNet-50 network trained on the [Places365](http://places2.csail.mit.edu/) dataset of about 1.8 million place (or scene) images. Places are recognized on three levels of detail:

        - **3 categories:** indoor, outdoor natural, and outdoor man-made
        - **16 categories:** e.g., home or hotel, transportation, forest or field
        - **365 categories:** e.g., kitchen, bus station, bamboo forest

        The full list of categories and how they are grouped can be found [here](https://docs.google.com/spreadsheets/d/1H7ADoEIGgbF_eXh9kcJjCs5j_r3VJwke4nebhkdzksg/edit#gid=142478777).

        Frames are taken from the video at the selected rate, and the model estimates for each frame how likely each of the 365 categories is; the probabilities of the coarser levels are derived from them. Each shot of the selected shot timeline is then labeled with the most likely place on each of the three levels on average across the shot.

        The result is a timeline with three labels per shot, one for each level, together with one timeline for each of the three top-level categories that shows its probability over time.

        Please note that the model recognizes the type of a place, not a specific location: it can tell that a scene shows a church, but not which church. To group shots that show the same location, use the "Place Clustering" plugin.

        #### Parameters

        - **Shot Boundaries from Timeline:** the shots to be labeled, e.g., the timeline created by the "Shot Boundary Detection" plugin. Its quality determines the result, so check it for missed or false cuts first.
        - **Frames per Second (FPS)** (advanced option): how many frames per second are analyzed. Higher values capture changes of the place within a shot more precisely but take longer to compute.
      timeline_name: Places
    shot_angle:
      plugin_name: Camera Angle Classification
      plugin_description: !md |
        This plugin determines the camera angle of each shot, i.e., from which direction the camera looks at the scene. It uses a [ConvNeXt V2](https://arxiv.org/abs/2301.00808) image classifier that we trained on the camera angle annotations of the [CineScale](https://cinescale.github.io/) dataset of feature films. It distinguishes five camera angles:

        - **Overhead:** the camera looks straight down from above (bird's-eye view)
        - **High:** the camera is above the subject and looks down at it
        - **Neutral:** the camera is at about the height of the subject and looks straight at it
        - **Low:** the camera is below the subject and looks up at it
        - **Dutch:** the camera is tilted sideways, so that the horizon is slanted

        The result is a timeline with the most likely camera angle per shot, together with one timeline per camera angle that shows its probability over time.

        #### Parameters

        - **Shot Boundaries from Timeline:** the shots to be labeled, e.g., the result of "Shot Boundary Detection".
        - **Frames per Second (FPS):** how many frames per second are analyzed. Higher values capture changes of the camera angle within a shot more precisely but take longer to compute.
      timeline_name: Camera Angles
    shot_density:
      plugin_name: Shot Density (Cutting Rate)
      plugin_description: !md |
        This plugin shows how fast the video is edited over time, i.e., how closely the cuts follow each other. Based on the shots of a selected timeline, a [kernel density estimation](https://scikit-learn.org/stable/modules/density.html#kernel-density-estimation) places a smooth curve around each cut and adds these curves up: where many cuts follow each other closely, the result is high; during long shots, it is low.

        The timeline distinguishes fast-paced passages, such as action sequences or montages, from slow-paced ones. The values are scaled from 0 (slowest editing in the video) to 1 (fastest), so they are best compared within one video.

        #### Parameters

        - **Shot Boundaries from Timeline:** the shots whose cuts are analyzed, e.g., the result of "Shot Boundary Detection".
        - **Bandwidth (seconds):** how far the influence of each cut spreads. Higher values give a smoother curve that shows the overall pace; lower values also show short bursts of fast cutting.
        - **Frames per Second (FPS):** how finely the curve is sampled over time.
      timeline_name: Shot Density
      input_timeline: Shot Boundaries from Timeline
      bandwidth: Bandwidth (seconds)
    shot_detection:
      plugin_name: Shot Boundary Detection (TransNet V2)
      plugin_description: !md |
        This plugin automatically splits the video into shots. It uses [TransNet V2](https://arxiv.org/abs/2008.04838), a neural network trained to recognize both hard cuts and gradual transitions such as dissolves and fades. Every frame of the video is analyzed, and the network estimates for each frame how likely a shot transition takes place. 

        The result is a timeline with one segment per shot. Many other plugins use this timeline as input, for example to annotate shots or compute the shot density. Mistakes can be corrected directly on the timeline: right-click a shot to split it at the current position or to merge it with its neighbors.

        Please note that very fast camera movements, flashes, or sudden lighting changes can occasionally be mistaken for cuts, and very soft transitions can be missed.
      timeline_name: Shots
    shot_level:
      plugin_name: Camera Level Classification
      plugin_description: !md |
        This plugin determines the camera level of each shot, i.e., at which height the camera is placed relative to the subject. It uses a [ConvNeXt V2](https://arxiv.org/abs/2301.00808) image classifier that we trained on the camera level annotations of the [CineScale](https://cinescale.github.io/) dataset of feature films. It distinguishes six camera levels:

        - **Aerial:** the camera is high above the scene, e.g., on a crane, helicopter, or drone
        - **Eye:** the camera is at the eye level of the people in the scene
        - **Shoulder:** the camera is at about shoulder height
        - **Hip:** the camera is at about hip height
        - **Knee:** the camera is at about knee height
        - **Ground:** the camera is placed on or close to the ground

        The camera level describes where the camera is, not in which direction it looks; for that, use "Camera Angle Classification". Since the levels are defined relative to people, results are less reliable for shots without people.

        The result is a timeline with the most likely camera level per shot, together with one timeline per camera level that shows its probability over time.

        #### Parameters

        - **Shot Boundaries from Timeline:** the shots to be labeled, e.g., the result of "Shot Boundary Detection".
        - **Frames per Second (FPS):** how many frames per second are analyzed. Higher values capture changes of the camera level within a shot more precisely but take longer to compute.
      timeline_name: Camera Levels
    shot_scalar_annotation:
      plugin_name: Average Value per Shot
      plugin_description: !md |
        This plugin converts a timeline with scalar values (e.g., probabilities) into shot annotations. For each shot of the selected shot timeline, the average of the values within the shot is computed. The result is a new timeline with one segment per shot, labeled with the average value. The color of each segment indicates the value compared with the other shots: the higher the value, the brighter the color.

        Shot annotations can be compared shot by shot and exported together with the other annotations, e.g., to [ELAN](https://archive.mpi.nl/tla/elan) for further analysis. Shots that are shorter than the time step of the selected curve contain no value and remain without a segment.

        #### Parameters

        - **Shot Boundaries from Timeline:** the shots for which the averages are computed, e.g., the timeline created by the "Shot Boundary Detection" plugin.
        - **Timeline with values:** the timeline whose curve is averaged per shot.
      timeline_name: Average Value per Shot
    shot_scale_and_movement:
      plugin_name: Shot Scale & Camera Movement
      plugin_description: !md |
        This plugin classifies both the shot scale and the camera movement of each shot. It uses a [VideoMAE](https://arxiv.org/abs/2203.12602) video transformer that we trained on the [MovieShots](https://arxiv.org/abs/2008.03548) dataset of shots from movie trailers. Unlike classifiers that look at single frames, it analyzes short video sections and can therefore recognize camera movements.

        The model distinguishes five shot scales:

        - **Extreme Close-Up:** only a small detail fills the frame, e.g., the eyes of a person or a part of an object
        - **Close-Up:** a face, a hand, or a small object fills most of the frame
        - **Medium:** a person from about the waist up, or a subject seen at a similar distance
        - **Full:** a person from head to toe, or a subject that is entirely visible and fills the frame
        - **Long:** people or objects appear small in their surroundings, e.g., landscapes or wide views of a scene

        and four types of camera movement:

        - **Static:** the camera does not move
        - **Motion:** the camera moves, e.g., pans, tilts, or follows a subject
        - **Push:** the camera moves toward the subject or zooms in
        - **Pull:** the camera moves away from the subject or zooms out

        The result consists of two groups of timelines, one for the shot scale and one for the camera movement. Each group contains a timeline with the most likely class per shot and one timeline per class showing its probability over time.

        #### Parameters

        - **Timeline names:** the first field names the shot scale timelines, the second the camera movement timelines.
        - **Shot Boundaries from Timeline:** the shots to be labeled, e.g., the result of "Shot Boundary Detection".
        - **Frames per Second (FPS):** how many frames per second are passed to the model. Higher values capture camera movements more precisely but take longer to compute.
      timeline_name_scale: Shot Scales
      timeline_name_movement: Shot Movements
    shot_type_classification:
      plugin_name: Shot Scale Classification
      plugin_description: !md |
        This plugin determines the shot scale (or shot size) of each shot, i.e., how large the people or objects appear in the frame. A neural network (ResNet) classifies frames of the video into five shot sizes, i.e., Extreme Close-Up, Close-Up, Medium Shot, Full Shot, and Long Shot. 

        Frames are taken from the video at the selected rate, and the network estimates for each frame how likely each shot size is. Each shot of the selected shot timeline is then labeled with the shot size that is the most likely on average across the shot. If the shot size changes within a shot, e.g., because of a zoom or camera movement, the label shows the size that dominates on average; the probability timelines show the changes in detail.

        The result is a timeline with one shot size per shot, together with one timeline per shot size that shows its probability over time.

        #### Parameters

        - **Shot Boundaries from Timeline:** the shots to be labeled, e.g., the timeline created by the "Shot Boundary Detection" plugin. Its quality determines the result, so check it for missed or false cuts first.
        - **Frames per Second (FPS)** (advanced option): how many frames per second are analyzed. Higher values capture changes in shot size within a shot more precisely but take longer to compute.
      timeline_name: Shot Scales
    text_ner:
      plugin_name: Named Entity Recognition and Disambiguation (NERD)
      timeline_name: Named Entities
      plugin_description: This plugin performs Named Entity Recognition (NER) and subsequently Entity Linking / Disambiguation based on the speaker segments of WhisperX.
    text_pos:
      plugin_name: PoS Tagging
      timeline_name: PoS Tagging
      plugin_description: This plugin performs PoS Tagging based on the speaker segments of WhisperX. For each speaker segment the count of each PoS-Tag is shown.
      language_code_name: Language Code
    text_sentiment:
      plugin_name: Sentiment Analysis
      timeline_name: Speech Sentiment
      plugin_description: This plugin performs sentiment analysis based on the speaker segments of WhisperX. The predicted label is shown as well as the predicted probabilities for each sentiment.
      model_selector_description: Model Type
    thumbnail:
      plugin_name: Thumbnail Generation
      plugin_description: !md |
        This plugin creates small preview images of the video. They are used in the tab "Shots", which shows three thumbnails for each shot: one from the beginning, one from the middle, and one from the end.

        The plugin runs automatically when a video is uploaded, so you normally do not need to start it yourself. Run it again only if the thumbnails in the tab "Shots" are missing, e.g., because the automatic run failed.
    vllm:
      plugin_name: Visual Question Answering
      plugin_description: !md |
        This plugin lets you ask a question about every shot of the video, or give an instruction such as "Describe the image", and stores the answer of a generative large vision-language model as an annotation of the shot. It uses Google's Gemma 4 model, which understands both images and text and runs locally at an [Ollama](https://ollama.com/) instance at TIB. Thus, **the images are not sent to an external service**.

        For each shot of the selected shot timeline, the frame in the middle of the shot is sent to the model together with your prompt. The answer is stored as the label of the shot. The same prompt on the same video always gives the same answers.

        The result is a timeline with one segment per shot, labeled with the model's answer. With prompts that ask for short, fixed answers, the timeline can be used like a classification, for example:

        _Is there a car in this image? Answer only with yes or no._\
        _How many people are visible? Answer only with a number._\
        _Is this scene indoors or outdoors? Answer with one word._

        Please note that the model only sees one frame per shot, so it cannot answer questions about what happens over the course of a shot. Like all language models, it can give wrong answers that sound convincing, so check important results against the video.

        #### Parameters

        - **Shot Boundaries from Timeline:** the shots to be analyzed, e.g., the timeline created by the "Shot Boundary Detection" plugin. One frame per shot is used.
        - **Query / Prompt:** the question or instruction for the model. Ask for short answers, e.g., "Answer only with yes or no", because the complete answer becomes the label of the shot; very long answers are shortened. The prompt can be written in other languages as well.
      timeline_name: Visual Question Answering
      search_term: Query / Prompt
    whisper:
      plugin_name: Speech Recognition (Whisper)
      plugin_description: !md |
        This plugin transcribes the speech in the video with OpenAI's [Whisper](https://github.com/openai/whisper) model ([paper](https://arxiv.org/abs/2212.04356)). Whisper detects the spoken language automatically and supports [about 100 languages](https://github.com/openai/whisper?tab=readme-ov-file#available-models-and-languages). The transcript is split into short phrases with their start and end times.

        The transcript is shown as a timeline and in the tab "Transcript", where you can search for words. The tab "Word Cloud" shows the most frequent words.

        The plugin does not distinguish between speakers. Please use "Speech & Speaker Recognition (WhisperX)" for that. Whisper can occasionally produce text for music, noise, or silence, so check important passages against the video.
      timeline_name: Whisper Transcript
    whisper_x:
      plugin_name: Speech & Speaker Recognition (WhisperX)
      plugin_description: !md |
        This plugin transcribes the speech in the video and determines who speaks when. It uses [WhisperX](https://github.com/m-bain/whisperX), which combines three steps:

        1. **Speech recognition:** OpenAI's [Whisper](https://github.com/openai/whisper) model (large-v3) transcribes the audio. Passages without speech are skipped, which reduces invented text during music or silence.
        2. **Word alignment:** a [wav2vec 2.0](https://arxiv.org/abs/2006.11477) model aligns every word precisely with the audio.
        3. **Speaker diarization:** [pyannote.audio](https://github.com/pyannote/pyannote-audio) groups similar voices into speakers and assigns each phrase to one speaker.

        The result is a group of two timelines: "Speech Transcript" contains each phrase with its speaker, and "Speaker" shows when each speaker talks. Speakers are numbered (SPEAKER_00, SPEAKER_01, …) separately for each video; they are not identified by name.

        #### Parameters

        - **Language Code:** the spoken language as a two-letter code, e.g., `en` or `de`. Keep `none` to detect it automatically. Entering it is more reliable for short videos or videos with a lot of music. It supports the [41 languages with a WhisperX alignment model](https://github.com/m-bain/whisperX/blob/main/whisperx/alignment.py).
        - **Speaker clustering threshold:** how similar two voices must be to count as the same speaker. Lower values produce more speakers, higher values fewer.
        - **Speaker regularization (Fb):** how strongly a small number of speakers is preferred. Higher values produce fewer speakers.
        - **Acoustic scaling (Fa):** how much small differences between voices count. Higher values tend to produce more speakers. 
      language_code_name: Language Code
      language_code_hint: If not provided, the spoken language is detected automatically
      timeline_name: WhisperX Transcript
      threshold: Speaker clustering threshold
      fb: Speaker regularization (Fb)
      fa: Acoustic scaling (Fa)
    x_clip:
      plugin_name: Action Search (X-CLIP)
      plugin_description: !md |
        This plugin searches the video for visual concepts and actions you describe in words, e.g., _people dancing_, _a person playing guitar_, or _someone running_. It uses [X-CLIP](https://arxiv.org/abs/2207.07285), a video version of CLIP that analyzes short video clips instead of single frames, and can therefore recognize what happens over time. The model was trained on the [Kinetics](https://arxiv.org/abs/1705.06950) dataset of human actions and works best for everyday and sports activities.

        Frames are taken from the video at the selected rate and grouped into clips of eight frames. X-CLIP compares each clip with your description, and the timeline shows for each clip how well it matches.

        The values are scaled per timeline, so the best-matching clip is always 1, even if the action does not occur in the video at all. Read the timeline as "where the action most likely happens", not as a yes/no answer.

        For concepts that can be recognized in a single frame, such as objects or places, the "Visual Concept Search (CLIP)" plugin is usually more precise.

        #### Parameters

        - **Action Description:** the action you are looking for, in English and in simple, unambiguous terms, e.g., _people dancing_ or _a person riding a bicycle_. Short descriptions of the activity usually work best.
        - **Frames per Second (FPS)** (advanced option): how many frames per second are used. Because each clip always consists of eight frames, this value also determines how long each clip is: lower values give longer clips, which suit slow or long actions; higher values give shorter clips with a finer time resolution, but longer actions may then be split into fragments.
      timeline_name: Action Search
      search_term: Action Description
