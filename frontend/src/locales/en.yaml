terms:
  title: TERMS OF USE
  content: !md |
    **1. Introduction**

    These Terms of Use ("Terms") govern access to and use of the video portal ("Portal") of TIB-AV-A. By using the Portal, you agree to the following Terms of Use.

    **2. Rights to Upload**

    2.1. By uploading content ("Content") to the Portal, you grant TIB-AV-A the non-exclusive right to store, process, analyze, and use the Content in order to provide the Portal's services.\
    2.2. You confirm that you have the necessary rights to upload the Content, including copyrights, trademark rights, and other rights required for the use of the Content.

    **3. Processing and Analysis**

    3.1. TIB-AV-A processes and analyzes the Content to provide the Portal's services, including the analysis of usage data and the optimization of the Content.\
    3.2. By using the Portal, you agree that TIB-AV-A may process and analyze the Content to provide the Portal's services.

    **4. Data Protection**

    4.1. TIB-AV-A treats your personal data confidentially and in accordance with data protection regulations.\
    4.2. By using the Portal, you agree that TIB-AV-A may process your personal data to provide the Portal's services.

    **5. Liability**

    5.1. TIB-AV-A is not liable for damages resulting from the use of the Portal, including the infringement of third-party rights.\
    5.2. By using the Portal, you agree that TIB-AV-A cannot be held liable for damages resulting from the use of the Portal.

    **6. Changes**

    6.1. TIB-AV-A may change these Terms of Use at any time.\
    6.2. By continuing to use the Portal after changes to the Terms of Use, you agree to the modified Terms of Use.

    **7. Final Provisions**

    7.1. These Terms of Use govern the entire contractual relationship between you and TIB-AV-A.\
    7.2. By using the Portal, you agree to these Terms of Use and confirm that you accept the following terms.
