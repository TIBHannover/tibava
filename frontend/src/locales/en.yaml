      timeline_name: Movie Pattern Opposition
      min_length: Minimum Length of the Pattern in Shots
    movie_pattern_shot_reverse_shot:
      plugin_name: Movie Pattern Shot Reverse Shot
      plugin_description: This plugin detects the movie pattern shot reverse shot based on the shot boundaries of a selected timeline.
      timeline_name: Movie Pattern Shot Reverse Shot
