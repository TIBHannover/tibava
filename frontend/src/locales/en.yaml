welcome:
  title: TIB AV-Analytics
  text: Welcome to the TIB AV-Analytics (TIB-AV-A) video analysis platform for systematic film and video analysis.
  demo_title: Video Demonstration
  login_title: How to create an account?
  login_text: !md |
    If you do not have an account yet, you can create an account at the top right ("Login" -> "Register").\
    New users can upload a maximum number of ten videos with a maximum file size of 500 MB.

    If you have questions regarding account creation or if you want to analyze more or larger video files, please write an email to [matthias.springstein@tib.eu](mailto:matthias.springstein@tib.eu) with a short explanation of your intended use case
  format_title: Video File Support
  format_text: !md |
    Please note that TIB-AV-A currently only supports the analysis of mp4 video files to avoid long processing times due to transcoding videos on our server. Please transcode them before uploading. If you have questions, feel free to contact us: [matthias.springstein@tib.eu](mailto:matthias.springstein@tib.eu)
